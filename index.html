<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Experiments</title>
  <meta name="description" content="A collection of small experimental web apps.">
  <style>
    :root {
      --bg: #f6f5f1; --surface: #fff; --text: #1d1c1a; --muted: #6b6860;
      --border: #dedbd2; --accent: #3d5afe; color-scheme: light;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #141412; --surface: #1e1e1b; --text: #edebe4; --muted: #a19e94;
        --border: #36352f; --accent: #7c8cff; color-scheme: dark;
      }
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    main { max-width: 720px; margin: 0 auto; padding: 40px 16px; }
    h1 { margin: 0 0 4px; font-size: 1.9rem; letter-spacing: -0.01em; }
    .sub { color: var(--muted); margin: 0 0 28px; }
    ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; }
    a.app { display: block; padding: 16px 18px; background: var(--surface); border: 1px solid var(--border); border-radius: 14px; color: inherit; text-decoration: none; }
    a.app:hover, a.app:focus-visible { border-color: var(--accent); outline: none; }
    .name { font-weight: 600; }
    .desc { color: var(--muted); font-size: 0.95rem; }
  </style>
</head>
<body>
  <main>
    <h1>Experiments</h1>
    <p class="sub">Small apps, each in its own folder.</p>
    <ul>
      <li>
        <a class="app" href="pitch-trainer/">
          <div class="name">Pitch Trainer</div>
          <div class="desc">Ear training for perfect pitch and intervals, with levels that unlock as you improve.</div>
        </a>
      </li>
    </ul>
  </main>
</body>
</html>
